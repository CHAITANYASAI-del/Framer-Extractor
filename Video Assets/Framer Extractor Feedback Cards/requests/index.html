<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framer Extractor 3.0 — You asked</title>
<meta name="description" content="The requests behind Framer Extractor 3.0.">
<style>
  :root {
    --bg: #000;
    --chip: rgba(20, 20, 24, 0.86);
    --chip-edge: rgba(255, 255, 255, 0.10);
    --text: #fff;
    --muted: rgba(255, 255, 255, 0.62);
    --brand: #1FA5E5;
    --brand-2: #38B8F1;
    --deep: #0B3BFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: fixed; inset: 0; }

  /* blue glow swirls */
  .glow { position: absolute; inset: -10%; pointer-events: none; }
  .glow svg { width: 100%; height: 100%; display: block; }
  .glow .spin-a { transform-origin: 18% 95%; animation: drift-a 18s ease-in-out infinite alternate; }
  .glow .spin-b { transform-origin: 85% 100%; animation: drift-b 22s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: rotate(-6deg) scale(1); } to { transform: rotate(8deg) scale(1.06); } }
  @keyframes drift-b { from { transform: rotate(5deg) scale(1.04); } to { transform: rotate(-7deg) scale(1); } }

  /* request chips */
  .chip {
    position: absolute;
    left: var(--x); top: var(--y);
    padding: clamp(10px, 1.05vw, 18px) clamp(14px, 1.3vw, 22px) clamp(12px, 1.15vw, 19px);
    background: var(--chip);
    border: 1px solid var(--chip-edge);
    border-radius: clamp(10px, 0.9vw, 16px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 10px 50px rgba(20, 90, 230, 0.22), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    width: max-content;
    max-width: min(30vw, calc(97vw - var(--x)));
    opacity: 0;
    transform: translateY(18px) scale(0.92);
    filter: blur(8px);
    will-change: transform, opacity, filter;
  }
  .chip .row { display: flex; align-items: center; gap: clamp(7px, 0.6vw, 11px); margin-bottom: clamp(4px, 0.45vw, 8px); }
  .chip .dot {
    width: clamp(14px, 1.2vw, 21px); height: clamp(14px, 1.2vw, 21px); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--dot) 70%, #fff), var(--dot) 65%);
    box-shadow: 0 0 14px color-mix(in srgb, var(--dot) 55%, transparent);
  }
  .chip .who { font-size: clamp(11px, 0.92vw, 16px); color: #fff; font-weight: 600; letter-spacing: 0.005em; }
  .chip .label { font-size: clamp(11px, 0.92vw, 16px); color: var(--muted); letter-spacing: 0.005em; }
  .chip .q { font-size: clamp(15px, 1.5vw, 27px); font-weight: 600; letter-spacing: -0.012em; text-wrap: balance; }

  /* chip lifecycle, driven by classes from the timeline script */
  .chip.in {
    animation: pop 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards, float 6s ease-in-out 900ms infinite alternate;
  }
  .chip.recede {
    transition: opacity 900ms ease, filter 900ms ease, transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0.18 !important; filter: blur(5px) !important;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translateY(18px) scale(0.92); filter: blur(8px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes float {
    from { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    to   { opacity: 1; filter: blur(0); transform: translateY(var(--f, -8px)) scale(1); }
  }


  /* wave 3: the asks, as in the launch video */
  .ask { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 600ms ease, filter 600ms ease; }
  .ask.on { opacity: 1; }
  .ask.dim { opacity: 0.16; filter: blur(4px); }
  .vq, .wq { position: absolute; font-family: Newsreader, Georgia, serif; font-style: italic; color: #fff; white-space: nowrap; letter-spacing: -0.01em; }
  .vq { left: 50%; top: 50%; font-weight: 520; font-size: clamp(24px, 2.7vw, 54px);
        transform: translate(-50%, calc(-50% + 34px)); opacity: 0; filter: blur(8px);
        transition: transform 560ms cubic-bezier(0.22, 1, 0.36, 1), opacity 560ms ease, filter 560ms ease; }
  .vq.in { transform: translate(-50%, -50%); opacity: 1; filter: blur(0); }
  .wq { font-weight: 450; opacity: 0; filter: blur(6px); transform: translateY(12px);
        transition: opacity 420ms ease, filter 420ms ease, transform 420ms cubic-bezier(0.22, 1, 0.36, 1); }
  .wq.in { opacity: 0.4; filter: blur(0); transform: none; }
  .vq .hl, .wq .hl { background: linear-gradient(180deg, #7cc4ff, #2f8cff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  /* payoff */
  .payoff {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: clamp(10px, 1.1vw, 18px);
    pointer-events: none; opacity: 0; transform: translateY(14px) scale(0.98); filter: blur(10px);
    transition: opacity 900ms ease, transform 1100ms cubic-bezier(0.22, 1, 0.36, 1), filter 900ms ease;
  }
  .payoff.show { opacity: 1; transform: none; filter: blur(0); }
  .payoff .tag {
    justify-self: center; display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 10px; border-radius: 999px;
    background: rgba(31, 165, 229, 0.12); border: 1px solid rgba(56, 184, 241, 0.35);
    font-size: clamp(12px, 1vw, 17px); color: #BFE6FB; font-weight: 500;
  }
  .payoff .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--brand-2); box-shadow: 0 0 12px var(--brand-2); }
  .payoff h1 {
    margin: 0; font-size: clamp(34px, 4.6vw, 84px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 700;
    background: linear-gradient(180deg, #fff 30%, #9fdcfb 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .payoff p { margin: 0; font-size: clamp(14px, 1.35vw, 24px); color: rgba(255,255,255,0.7); letter-spacing: -0.005em; }
  .payoff p b { color: #fff; font-weight: 600; }

  /* phones: stack the chips in a column */
  @media (max-width: 760px) {
    .chip { left: 50% !important; translate: -50% 0; }
    .chip .q { white-space: normal; max-width: 80vw; }
    .chip[data-slot="0"] { top: 12% !important; } .chip[data-slot="1"] { top: 27% !important; }
    .chip[data-slot="2"] { top: 57% !important; } .chip[data-slot="3"] { top: 42% !important; }
    .chip[data-slot="4"] { top: 72% !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .chip, .chip.in { animation: none !important; opacity: 1; transform: none; filter: none; }
    .glow .spin-a, .glow .spin-b { animation: none; }
  }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400..600&display=swap" rel="stylesheet">
</head>
<body>
<div class="stage">
  <div class="glow" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0a1cff"/><stop offset="0.55" stop-color="#1268ff"/><stop offset="1" stop-color="#38B8F1"/>
        </linearGradient>
        <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#38B8F1"/><stop offset="0.5" stop-color="#1650ff"/><stop offset="1" stop-color="#0a14d8"/>
        </linearGradient>
        <filter id="b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
        <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
      </defs>
      <g class="spin-a">
        <ellipse cx="170" cy="760" rx="330" ry="470" fill="none" stroke="url(#g1)" stroke-width="150" opacity="0.55" filter="url(#b1)"/>
        <ellipse cx="190" cy="760" rx="300" ry="440" fill="none" stroke="url(#g1)" stroke-width="18" opacity="0.55" filter="url(#b2)"/>
      </g>
      <g class="spin-b">
        <ellipse cx="1330" cy="930" rx="420" ry="330" fill="none" stroke="url(#g2)" stroke-width="170" opacity="0.6" filter="url(#b1)"/>
        <ellipse cx="1320" cy="930" rx="390" ry="300" fill="none" stroke="url(#g2)" stroke-width="20" opacity="0.6" filter="url(#b2)"/>
        <ellipse cx="900" cy="1010" rx="520" ry="210" fill="none" stroke="url(#g1)" stroke-width="110" opacity="0.35" filter="url(#b1)"/>
      </g>
    </svg>
  </div>

  <div id="chips"></div>
  <div class="ask" id="ask" aria-hidden="true"></div>

  <div class="payoff" aria-live="polite">
    <span class="tag"><i></i>Framer Extractor 3.0</span>
    <h1>You asked.<br>3.0 ships it.</h1>
    <p><b>CMS export</b> · edit content locally · <b>Publish</b> straight to your site</p>
  </div>
</div>

<script>
  // Two waves of real asks, then the 3.0 payoff. Loops.
  //  wave 1: real r/framer post titles · wave 2: real complaints from r/framer and the Chrome Web Store
  // ?hold=1, ?hold=2 or ?hold=3 freezes on that wave for recording.
  (function () {
    var SLOTS = [
      { x: '11%', y: '19%', f: '-7px' }, { x: '51%', y: '14.5%', f: '-9px' }, { x: '64%', y: '49%', f: '-6px' },
      { x: '23.5%', y: '58%', f: '-8px' }, { x: '8%', y: '84%', f: '-7px' }
    ];
    var DOTS = ['#5B7CFA', '#F2785C', '#A77BF3', '#3CC9A6', '#F5C451'];
    // Every chip is a real public post or review: who said it, where, and when (quoted verbatim)
    var WAVES = [
      { items: [
        { q: 'Best way to move a personal site from Framer to another hosting/platform?', by: 'u/TheS4m', at: 'r/framer · Apr 2026' },
        { q: 'Have you been able to export your site from Framer?', by: 'u/Exotic_Corner7505', at: 'r/framer · Jul 2026' },
        { q: 'Framer website export is a lie', by: 'u/exciting_username_', at: 'r/framer · Aug 2026' },
        { q: 'How to export design to host on another platform?', by: 'u/Dapper_Ad_3154', at: 'r/framer · Feb 2025' },
        { q: 'Can Framer projects be exported/edited as actual code (e.g. in VS Code)?', by: 'u/IKnowUCantPvp', at: 'r/framer · Jun 2026' }
      ] },
      { items: [
        { q: "Looks like it might be missing something with the CMS subpages?", by: 'László Gaál', at: 'LinkedIn' },
        { q: 'How do I add a new blog post after exporting?', by: 'Manjul Joshi', at: '' },
        { q: 'CMS support please 🙏', by: 'Sushant', at: '' },
        { q: 'Can I edit my projects without going back to Framer?', by: 'Vithyanela K', at: '' },
        { q: 'Changing one image means re-exporting everything?', by: 'Praharsha Nelaturi', at: '' }
      ] }
    ];
    var host = document.getElementById('chips');
    var payoff = document.querySelector('.payoff');
    var m = location.search.match(/[?&]hold=?(\d)?/);
    var hold = m ? (Number(m[1]) || 2) : 0;
    var timers = [];
    function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
    function esc(t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function build(wave) {
      host.innerHTML = '';
      return wave.items.map(function (q, i) {
        var s = SLOTS[i], el = document.createElement('div');
        el.className = 'chip'; el.setAttribute('data-slot', i);
        el.style.cssText = '--x:' + s.x + ';--y:' + s.y + ';--dot:' + DOTS[i] + ';--f:' + s.f;
        el.innerHTML = '<div class="row"><span class="dot"></span><span class="who">' + esc(q.by) + '</span><span class="label">' + esc(q.at) + '</span></div><div class="q">' + esc(q.q) + '</div>';
        host.appendChild(el);
        return el;
      });
    }
    function showWave(wave, t0) {
      var els;
      at(t0, function () { els = build(wave); });
      [0, 1, 3, 2, 4].forEach(function (i, k) { at(t0 + 300 + k * 520, function () { els[i].classList.add('in'); }); });
      return function (t) { at(t, function () { els.forEach(function (e) { e.style.transition = 'opacity 600ms ease, filter 600ms ease'; e.style.opacity = '0'; e.style.filter = 'blur(6px)'; }); }); };
    }
    // wave 3: the comments from the launch video (stacking questions, then the wall)
    var ASK = [
      '“Can it export the <span class="hl">CMS</span> too?”',
      '“How do I <span class="hl">update my blog</span> after exporting?”',
      '“<span class="hl">CMS</span> support when?”',
      '“Can I <span class="hl">edit my projects</span> without Framer?”'
    ];
    var WALL = [
      ['Will CMS items export?', 8.9, 11.1, 1.77], ['What about my blog?', 70.3, 13.9, 1.56], ['Edit content without Framer?', 13.5, 24.1, 1.46],
      ['CMS please 🙏', 78.1, 26.9, 1.88], ['How do I add a new post?', 61.5, 7.4, 1.35], ['Can clients update the content?', 4.7, 35.2, 1.35],
      ['Any way to edit after export?', 74, 47.5, 1.46], ['CMS?', 42.7, 13.9, 2.08], ['Need CMS support', 7.3, 70.4, 1.67],
      ['Blog updates?', 77.1, 66.7, 1.56], ['Can I change one image?', 16.7, 81.5, 1.46], ['Does the CMS come with it?', 59.9, 79.6, 1.56],
      ['CMS when?', 43.2, 88.9, 1.77], ['Edit my case studies?', 76, 90.7, 1.35], ['Update projects after export?', 3.6, 92.6, 1.35], ['CMS export?', 29.2, 70.4, 1.46]
    ];
    var ask = document.getElementById('ask');
    function showAsk(t0) {
      at(t0, function () { ask.innerHTML = ''; ask.className = 'ask on'; });
      ASK.forEach(function (q, i) {
        at(t0 + 250 + i * 900, function () {
          ask.querySelectorAll('.vq').forEach(function (el) {
            var age = Number(el.getAttribute('data-age')) + 1; el.setAttribute('data-age', age);
            el.style.transform = 'translate(-50%, calc(-50% - ' + (age * 4.1) + 'vw)) scale(0.8)';
            el.style.opacity = String(Math.max(0, 0.55 - 0.16 * (age - 1)));
          });
          var el = document.createElement('div'); el.className = 'vq'; el.setAttribute('data-age', '0'); el.innerHTML = q;
          ask.appendChild(el); requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('in'); }); });
        });
      });
      WALL.forEach(function (w, i) {
        at(t0 + 250 + 4 * 900 + i * 45, function () {
          var el = document.createElement('div'); el.className = 'wq';
          el.style.left = w[1] + '%'; el.style.top = w[2] + '%'; el.style.fontSize = w[3] + 'vw';
          el.innerHTML = '“' + esc(w[0]).replace(/CMS/g, '<span class="hl">CMS</span>') + '”';
          ask.insertBefore(el, ask.firstChild); requestAnimationFrame(function () { el.classList.add('in'); });
        });
      });
    }
    function run() {
      timers.forEach(clearTimeout); timers = [];
      payoff.classList.remove('show'); host.innerHTML = ''; ask.innerHTML = ''; ask.className = 'ask';
      if (hold === 3) { showAsk(0); return; }
      if (hold) { showWave(WAVES[hold - 1], 0); return; }
      showWave(WAVES[0], 300)(5600);
      showWave(WAVES[1], 6400)(11700);
      showAsk(12400);
      at(18200, function () { ask.classList.add('dim'); });
      at(18400, function () { payoff.classList.add('show'); });
      at(22600, function () { payoff.classList.remove('show'); ask.className = 'ask'; });
      at(23600, run);
    }
    run();
  })();
</script>
</body>
</html>
