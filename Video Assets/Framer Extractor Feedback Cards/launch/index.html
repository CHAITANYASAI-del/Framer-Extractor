<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framer Extractor 3.0 — Upgraded</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; }
  #bg { z-index: 0; pointer-events: none; }  /* same background as the background clip */
  /* button at half size, still centred */
  #btn { z-index: 1; background: transparent; transform: scale(0.5); transform-origin: 50% 50%; }
  /* ?cursor=1 : a Mac pointer glides onto the button (0.3s-1.0s) and rests on it, like a screen recording */
  #cursor { position: fixed; left: 50vw; top: 50vh; width: 26px; height: 26px; z-index: 5; pointer-events: none; display: none;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); animation: fx-glide 700ms cubic-bezier(0.25, 0.8, 0.25, 1) 300ms both; }
  body.show-cursor #cursor { display: block; }
  @keyframes fx-glide { from { transform: translate(30vw, 32vh); } to { transform: translate(-3px, -2px); } }
</style>
</head>
<body>
  <!-- shader background (text removed) with the halo-ring "Introducing v3.0" button on top -->
  <iframe id="bg" src="../bg/" title="" aria-hidden="true" tabindex="-1"></iframe>
  <iframe id="btn" src="../halo/" title="Introducing v3.0" allowtransparency="true"></iframe>
  <svg id="cursor" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 2.5v18.2l4.4-4.2 2.9 6.6 3.1-1.4-2.9-6.5h6.1L5 2.5z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <script>if (/[?&]cursor=1/.test(location.search)) document.body.classList.add("show-cursor");</script>
</body>
</html>
